<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the installed app use the whole screen; the page keeps clear of the notch and home bar itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B00020" />

    <!--
      Installable app. The manifest and the icon are made per restaurant from the address the visitor is on (see
      api/manifest.js and api/app-icon.js), so each restaurant's app carries its own name, colour and logo.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon/180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Platform-level fallbacks. Each storefront replaces these at runtime with
      its own name, tagline and hero shot (see src/lib/pageMeta.js).

      Crawlers that do not execute JavaScript — WhatsApp and most chat apps —
      only ever see what is below, so these must stand on their own rather than
      naming one particular restaurant. Per-restaurant link previews need the
      tags rendered server-side at deploy time.
    -->
    <title>Order from your favourite restaurants</title>
    <meta
      name="description"
      content="Browse menus and order directly from restaurants near you — delivery or pickup."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Order from your favourite restaurants" />
    <meta
      property="og:description"
      content="Browse menus and order directly from restaurants near you — delivery or pickup."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
